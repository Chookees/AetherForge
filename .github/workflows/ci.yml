name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build solution
        run: dotnet build AomrModEditor.sln
      - name: Run automated tests
        run: dotnet test AomrModEditor.sln --no-build
